<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Контакти - FoodExpress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">FoodExpress</div>
        <ul>
            <li><a href="index.html">Начало</a></li>
            <li><a href="menu.html">Меню</a></li>
            <li><a href="contacts.html">Контакти</a></li>
        </ul>
    </nav>

    <header>
        <h1>Свържете се с нас</h1>
        <p>Имате въпроси или обратна връзка? Ние сме тук, за да помогнем.</p>
    </header>

    <main class="contact-container">
        <section class="contact-info">
            <div class="card">
                <h3>Адрес</h3>
                <p>гр. Стара Загора, център</p>
            </div>
            <div class="card">
                <h3>Телефон</h3>
                <p>+359 888 123 456</p>
            </div>
            <div class="card">
                <h3>Работно време</h3>
                <p>Всеки ден: 10:00 - 22:00</p>
            </div>
        </section>

        <section class="contact-form-section">
            <form class="contact-form">
                <input type="text" placeholder="Вашето име" required>
                <input type="email" placeholder="Вашият имейл" required>
                <textarea placeholder="Вашето съобщение" rows="5" required></textarea>
                <button type="submit">Изпрати запитване</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
